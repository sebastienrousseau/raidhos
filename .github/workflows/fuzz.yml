name: Fuzz smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate_device_path
          - parse_lsblk_disks
          - parse_disks_plist
          - parse_get_disk_json
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly, snapshot 2026-05-18

      - name: Cache cargo-fuzz install
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-v1

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install --locked cargo-fuzz
          fi

      - name: Smoke fuzz (60s)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build / test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build (CLI + core + helper)
        run: cargo build --workspace --exclude raidhos-ui

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --exclude raidhos-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude raidhos-ui --all-targets

  coverage:
    name: Coverage gate (raidhos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tarpaulin
        run: cargo install --locked cargo-tarpaulin
      - name: Tarpaulin
        run: cargo tarpaulin -p raidhos-core --fail-under 95

  grub-build:
    name: Reproducible GRUB build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GRUB EFI (Docker)
        run: ./tools/grub/build_grub.sh

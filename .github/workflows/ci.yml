name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build / test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-targets: true
          cache-all-crates: true

      - name: Build (CLI + core + helper)
        run: cargo build --workspace --exclude raidhos-ui

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --exclude raidhos-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude raidhos-ui --all-targets

  coverage:
    name: Coverage gate (raidhos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + tarpaulin install
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-targets: true

      - name: Cache tarpaulin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-v1

      - name: Install tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null 2>&1; then
            cargo install --locked cargo-tarpaulin
          fi
      # Coverage floor. The actual measured number on Linux CI is
      # ~68% — the gap to a higher gate is structural: tests for
      # platform/{macos,windows}.rs are gated with
      # `#[cfg(all(test, target_os = "…"))]` so they only run on
      # the matching host. Tarpaulin runs on Linux and sees the
      # macos.rs / windows.rs code but cannot execute their tests.
      # Raising this gate requires either re-architecting those
      # tests to be cross-platform (some can — the parser tests
      # already are — others are platform-shape-dependent) or
      # adding a macOS/Windows tarpaulin job.
      # Tracking: 75% by v0.0.2 (refactor windows/macos tests),
      #            95% by v0.1.0 (per-host coverage jobs).
      - name: Tarpaulin
        run: |
          cargo tarpaulin -p raidhos-core --fail-under 65 --out Xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: warn

  grub-build:
    name: Reproducible GRUB build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GRUB EFI (Docker)
        run: ./tools/grub/build_grub.sh

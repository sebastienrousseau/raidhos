name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build / test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-targets: true
          cache-all-crates: true

      - name: Build (CLI + core + helper)
        run: cargo build --workspace --exclude raidhos-ui

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --exclude raidhos-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude raidhos-ui --all-targets

  coverage:
    name: Coverage gate (raidhos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + tarpaulin install
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-targets: true

      - name: Cache tarpaulin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-v1

      - name: Install tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null 2>&1; then
            cargo install --locked cargo-tarpaulin
          fi
      # Coverage gate: 100% across raidhos-core, raidhos-cli, and
      # raidhos-priv-helper. Untestable lines (binary entry points,
      # platform-specific dispatch wrappers) have been refactored
      # into helpers with unit tests; pub-fn wrappers in
      # platform/{linux,macos,windows}.rs are cfg-gated to their
      # host so each runner only sees its own arm.
      #
      # If this gate fails, fix the test — don't lower the bar.
      # See `docs/V0_0_1_STATUS.md` for the per-file breakdown.
      - name: Tarpaulin (raidhos-core, 100%)
        run: |
          cargo tarpaulin \
            -p raidhos-core \
            --exclude-files 'crates/priv-helper/**' \
            --exclude-files 'crates/cli/**' \
            --exclude-files 'crates/ui-tauri/**' \
            --exclude-files 'fuzz/**' \
            --fail-under 100 \
            --out Xml
      - name: Tarpaulin (raidhos-cli, 100%)
        run: |
          # `--follow-exec` is needed on Linux: tarpaulin's default
          # ptrace engine doesn't trace into spawned child processes,
          # which means the cli integration tests (which spawn the
          # built binary) wouldn't contribute coverage to main.rs.
          # Also exclude the integration-test files themselves so the
          # gate is strictly about the cli's source, not the test
          # scaffolding.
          cargo tarpaulin \
            -p raidhos-cli \
            --engine llvm \
            --exclude-files 'crates/core/**' \
            --exclude-files 'crates/priv-helper/**' \
            --exclude-files 'crates/ui-tauri/**' \
            --exclude-files 'crates/cli/tests/**' \
            --exclude-files 'fuzz/**' \
            --fail-under 100
      - name: Tarpaulin (raidhos-priv-helper, 100%)
        run: |
          cargo tarpaulin \
            -p raidhos-priv-helper \
            --engine llvm \
            --exclude-files 'crates/core/**' \
            --exclude-files 'crates/cli/**' \
            --exclude-files 'crates/ui-tauri/**' \
            --exclude-files 'crates/priv-helper/tests/**' \
            --exclude-files 'fuzz/**' \
            --fail-under 100
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: warn

  grub-build:
    name: Reproducible GRUB build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GRUB EFI (Docker)
        run: ./tools/grub/build_grub.sh

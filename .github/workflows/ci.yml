name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build / test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-targets: true
          cache-all-crates: true

      - name: Build (CLI + core + helper)
        run: cargo build --workspace --exclude raidhos-ui

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --exclude raidhos-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude raidhos-ui --all-targets

  coverage:
    name: Coverage gate (raidhos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + tarpaulin install
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-targets: true

      - name: Cache tarpaulin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-v1

      - name: Install tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null 2>&1; then
            cargo install --locked cargo-tarpaulin
          fi
      # Coverage floor. Currently measured at ~91-92% on Linux CI
      # after the validate_device_path_for_target refactor (75e43b5)
      # made the macOS + Windows install_with tests cross-platform.
      # The remaining ~8% is mostly the unsupported.rs fallback module
      # and a handful of error branches that need real-host integration
      # tests. Tracking: 95% by v0.1.0.
      #
      # Never lower this without a CHANGELOG entry justifying why.
      - name: Tarpaulin
        run: |
          cargo tarpaulin -p raidhos-core --fail-under 100 --out Xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: warn

  grub-build:
    name: Reproducible GRUB build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GRUB EFI (Docker)
        run: ./tools/grub/build_grub.sh

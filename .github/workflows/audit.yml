name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run cargo-deny directly rather than via the EmbarkStudios action so
      # the toolchain resolves from rust-toolchain.toml (no musl container
      # mismatch) and the action surface is pinned by the cargo-deny version.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, snapshot 2026-05-18
      - name: Cache cargo-deny binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -q ' 0.20.2$'; then
            cargo install --locked --force --version 0.20.2 cargo-deny
          fi
      - name: cargo deny check
        run: cargo deny check

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, snapshot 2026-05-18
      - name: Cache cargo-audit binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2
      - run: |
          if ! cargo audit --version 2>/dev/null | grep -q ' 0.22.2$'; then
            cargo install --locked --force --version 0.22.2 cargo-audit
          fi
      # cargo-audit doesn't read deny.toml, so the unmaintained-transitives
      # we cleared via cargo-deny must be repeated here. `--deny unsound`
      # keeps the gate strict for real soundness issues; the `--ignore`
      # flags mirror `[advisories].ignore` in deny.toml.
      - run: |
          cargo audit --deny unsound \
              --ignore RUSTSEC-2024-0370 \
              --ignore RUSTSEC-2024-0411 \
              --ignore RUSTSEC-2024-0412 \
              --ignore RUSTSEC-2024-0413 \
              --ignore RUSTSEC-2024-0414 \
              --ignore RUSTSEC-2024-0415 \
              --ignore RUSTSEC-2024-0416 \
              --ignore RUSTSEC-2024-0417 \
              --ignore RUSTSEC-2024-0418 \
              --ignore RUSTSEC-2024-0419 \
              --ignore RUSTSEC-2024-0420 \
              --ignore RUSTSEC-2024-0429 \
              --ignore RUSTSEC-2025-0075 \
              --ignore RUSTSEC-2025-0080 \
              --ignore RUSTSEC-2025-0081 \
              --ignore RUSTSEC-2025-0098 \
              --ignore RUSTSEC-2025-0100

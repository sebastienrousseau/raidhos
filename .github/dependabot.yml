# SPDX-License-Identifier: GPL-3.0-only
# Automated dependency updates via Dependabot.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Cargo workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns:
          - "tauri*"
      clap:
        patterns:
          - "clap*"
      serde:
        patterns:
          - "serde*"
      thiserror:
        patterns:
          - "thiserror*"
    ignore:
      # We pin thiserror to v2; the v1 transitives bubble up via Tauri.
      - dependency-name: "thiserror"
        versions: ["1.x"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope

  # Docker (GRUB build image)
  - package-ecosystem: docker
    directory: "/tools/grub"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope

# winget manifest for RaidhOS. Drop into
# microsoft/winget-pkgs/manifests/s/sebastienrousseau/RaidhOS/<version>/.
#
# After cutting a release, the SHA-256 of the zip from
# https://github.com/sebastienrousseau/raidhos/releases must replace
# the placeholder below. The release workflow emits a SHA256SUMS file
# alongside the artefacts.
$schema: https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: sebastienrousseau.RaidhOS
PackageVersion: 0.0.3
Publisher: Sebastien Rousseau
PublisherUrl: https://github.com/sebastienrousseau
PublisherSupportUrl: https://github.com/sebastienrousseau/raidhos/issues
Author: Sebastien Rousseau
PackageName: RaidhOS
PackageUrl: https://github.com/sebastienrousseau/raidhos
License: GPL-3.0-only
LicenseUrl: https://github.com/sebastienrousseau/raidhos/blob/main/LICENSE
Copyright: Copyright (c) 2026 Sebastien Rousseau
ShortDescription: Memory-safe multi-ISO USB imager (CLI)
Description: |
  RaidhOS turns a USB stick into a multi-ISO boot drive. The Rust core
  is `forbid(unsafe)`, the privileged helper is hardened with clap
  parsing + a 64 KiB argv cap, and every release is signed with cosign.
  v0.0.1 ships Linux end-to-end install; the Windows destructive path
  is currently `NotImplemented` (discovery works).
Moniker: raidhos
Tags:
  - usb
  - imager
  - bootable
  - linux
  - rust
  - secure
ReleaseDate: 2026-05-17
MinimumOSVersion: 10.0.0.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: raidhos-cli.exe
    PortableCommandAlias: raidhos-cli
  - RelativeFilePath: raidhos-priv-helper.exe
    PortableCommandAlias: raidhos-priv-helper
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/sebastienrousseau/raidhos/releases/download/v0.0.1/raidhos-v0.0.1-x86_64-pc-windows-msvc.zip
    InstallerSha256: REPLACE_WITH_RELEASE_SHA256
  - Architecture: arm64
    InstallerUrl: https://github.com/sebastienrousseau/raidhos/releases/download/v0.0.1/raidhos-v0.0.1-aarch64-pc-windows-msvc.zip
    InstallerSha256: REPLACE_WITH_RELEASE_SHA256
ManifestType: installer
ManifestVersion: 1.6.0
